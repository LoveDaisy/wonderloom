name: Check and deploy Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_hint:
        description: '仅供审计的 Writing-Lab 触发提示；构建仍读取开始时的 main'
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check site
    outputs:
      source_sha: ${{ steps.writing_lab.outputs.sha }}
      website_sha: ${{ steps.writing_lab.outputs.website_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out Writing-Lab source snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LoveDaisy/ice_halo_notes
          ref: main
          path: writing-lab
          lfs: true
          persist-credentials: false
      - name: Record immutable source revision
        id: writing_lab
        run: |
          echo "sha=$(git -C writing-lab rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "website_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:content
      - run: npm run check
        env:
          WRITING_LAB_SOURCE_DIR: ${{ github.workspace }}/writing-lab
          WRITING_LAB_SOURCE_SHA: ${{ steps.writing_lab.outputs.sha }}
      - run: npm run build
        env:
          WRITING_LAB_SOURCE_DIR: ${{ github.workspace }}/writing-lab
          WRITING_LAB_SOURCE_SHA: ${{ steps.writing_lab.outputs.sha }}
      - run: npm run test:site
        env:
          WRITING_LAB_SOURCE_DIR: ${{ github.workspace }}/writing-lab
          WRITING_LAB_SOURCE_SHA: ${{ steps.writing_lab.outputs.sha }}
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy Pages
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CANDIDATE_WEBSITE_SHA: ${{ needs.check.outputs.website_sha }}
      CANDIDATE_SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out candidate deployment guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check.outputs.website_sha }}
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Final freshness gate under Pages lock
        id: freshness
        run: node scripts/check-deployment.mjs check
      - name: Request latest build for stale candidate
        if: steps.freshness.outputs.fresh == 'false'
        run: node scripts/check-deployment.mjs refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.fresh == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Recheck after deployment and converge to latest
        if: steps.deployment.outcome == 'success'
        run: node scripts/check-deployment.mjs settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
